name: rawkit
description: A reusable Dart SDK for importing and developing camera RAW images.
version: 0.1.0

environment:
  sdk: ^3.13.0

platforms:
  linux:
  macos:
  windows:

executables:
  download_library: download_library

dependencies:
  archive: ^4.0.9
  code_assets: ^1.2.1
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^2.1.0
  native_toolchain_c: ^0.19.3

dev_dependencies:
  lints: ^6.1.0
  release: ^0.1.9
  test: ^1.31.2

release:
  changelog:
    header: '# 📰 RawKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
